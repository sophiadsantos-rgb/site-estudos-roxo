<main>
<section class="page-header"><div class="container"><h1>Planeje seus estudos</h1><p class="lead mb-0">Preencha o formulário para organizar sua próxima sessão.</p></div></section>
<section class="py-5">
<div class="container">
<div class="card p-4 p-md-5 mx-auto" style="max-width:900px">
<form>
<div class="row g-3">
<div class="col-md-6"><label for="nome" class="form-label">Nome</label><input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome" required></div>
<div class="col-md-6"><label for="email" class="form-label">E-mail</label><input type="email" class="form-control" id="email" name="email" placeholder="nome@email.com" required></div>
<div class="col-md-6"><label for="materia" class="form-label">Matéria principal</label><select class="form-select" id="materia" name="materia" required><option value="" selected disabled>Escolha uma matéria</option><option>Matemática</option><option>Português</option><option>Biologia</option><option>História</option><option>Inglês</option><option>Outra</option></select></div>
<div class="col-md-6"><label for="data" class="form-label">Data de estudo</label><input type="date" class="form-control" id="data" name="data"></div>
<div class="col-md-6"><label for="tempo" class="form-label">Tempo disponível</label><input type="number" class="form-control" id="tempo" name="tempo" min="15" placeholder="Ex.: 60 minutos"></div>
<div class="col-md-6"><label for="tipo" class="form-label">Objetivo</label><select class="form-select" id="tipo" name="tipo"><option>Aprender conteúdo novo</option><option>Fazer exercícios</option><option>Revisar</option><option>Preparar para prova</option></select></div>
<div class="col-12"><label for="mensagem" class="form-label">O que você precisa estudar?</label><textarea class="form-control" id="mensagem" name="mensagem" rows="5" placeholder="Escreva os conteúdos ou tarefas..."></textarea></div>
<div class="col-12"><button type="submit" class="btn btn-purple">Salvar planejamento</button><button type="reset" class="btn btn-outline-secondary ms-2">Limpar</button></div>
</div>
</form>
</div>
</div>
</section>
</main>

<footer>
<div class="container text-center">
<p class="mb-1"><strong>StudySpace ✦</strong> — Seu espaço para aprender.</p>
